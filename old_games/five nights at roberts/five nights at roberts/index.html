<html>
    <head>

        <style>

            #canvas {

                position: absolute;
                left: 0px;
                top: 0px;

            }

            .cambtn.on {
                font-family: Arial;
                color: #ffffff;
                font-size: 10px;
                background: #4fd934;
                /*padding: 3px 4px 4px 4px;*/
                text-decoration: none;
                position:  absolute;
            }

            .cambtn.on:hover {
                background: #46c22d;
                background-image: -webkit-linear-gradient(top, #46c22d, #2fb029);
                background-image: -moz-linear-gradient(top, #46c22d, #2fb029);
                background-image: -ms-linear-gradient(top, #46c22d, #2fb029);
                background-image: -o-linear-gradient(top, #46c22d, #2fb029);
                background-image: linear-gradient(to bottom, #46c22d, #2fb029);
                text-decoration: none;
            }

            .cambtn {
                user-select:  none;
                font-family: Arial;
                color: #ffffff;
                font-size: 10px;
                background: #bfc2be;
                padding: 0.5% 0.5% 0.5% 0.5%;
                text-decoration: none;
                position:  absolute;
            }

            .cambtn:hover {
                background: #b0b0b0;
                background-image: -webkit-linear-gradient(top, #b0b0b0, #a3a3a3);
                background-image: -moz-linear-gradient(top, #b0b0b0, #a3a3a3);
                background-image: -ms-linear-gradient(top, #b0b0b0, #a3a3a3);
                background-image: -o-linear-gradient(top, #b0b0b0, #a3a3a3);
                background-image: linear-gradient(to bottom, #b0b0b0, #a3a3a3);
                text-decoration: none;
                cursor: pointer;
            }

            #forward {

                position: absolute;
                left: 50px;
            }

            #back {

                position: absolute;

            }
        </style>

    </head>

    <body>

        <canvas id="canvas"></canvas>
        <script src="index.js"></script>

        <button id="back" onClick="robertlocation--;">⬅️</button>
        <button id="forward" onClick="robertlocation++;">➡️</button>

        <button id='cam1' class='cambtn' onClick="switchcam(0,this)">Cam 1</button>
        <button id='cam2' class='cambtn' onClick="switchcam(1,this)">Cam 2</button>
        <button id='cam3' class='cambtn' onClick="switchcam(2,this)">Cam 3</button>
        <button id='cam4' class='cambtn' onClick="switchcam(3,this)">Cam 4</button>
        <button id='cam5' class='cambtn' onClick="switchcam(4,this)">Cam 5</button>
        <button id='cam6' class='cambtn' onClick="switchcam(5,this)">Cam 6</button>
        <button id='cam7' class='cambtn' onClick="switchcam(6,this)">Cam 7</button>

    </body>

</html>
